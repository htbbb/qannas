[project]
name = "qannas"
version = "0.1.0"
description = "Qannas — autonomous, scope-gated web pentesting + CTF platform with a planner-driven agent loop and a separate deterministic validator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.40"]

[project.scripts]
qannas = "qannas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qannas"]
